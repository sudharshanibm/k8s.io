apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-system
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels:
            clusterType: prow
          matchExpressions:
            - key: name
              operator: NotIn
              values:
                - gke-prow
                - gke-prow-build-trusted
  template:
    metadata:
      name: 'kube-system-{{ .name }}'
    spec:
      destination:
        namespace: kube-system
        server: "{{ .server }}"
      project: default
      sources:
        - path: kubernetes/{{ .name }}/kube-system
          repoURL: https://github.com/kubernetes/k8s.io
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
  templatePatch: |
    {{- if eq .name "ibm-s390x" }}
    spec:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: ibm-vpc-block-csi-controller
          namespace: kube-system
          jsonPointers:
            - /spec/template/metadata/annotations/storage.ibmcloud.k8s.io~1credential-sha256
        - group: apps
          kind: DaemonSet
          name: ibm-vpc-block-csi-node
          namespace: kube-system
          jsonPointers:
            - /spec/template/metadata/annotations/storage.ibmcloud.k8s.io~1credential-sha256
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
    {{- else }}
    {}
    {{- end }}
