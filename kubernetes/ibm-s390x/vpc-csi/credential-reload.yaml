apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpc-csi-credential-reload
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpc-csi-credential-reload
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [storage-secret-store]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [ibm-vpc-block-csi-controller]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [ibm-vpc-block-csi-node]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpc-csi-credential-reload
subjects:
  - kind: ServiceAccount
    name: vpc-csi-credential-reload
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vpc-csi-credential-reload
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpc-csi-credential-reload
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: vpc-csi-credential-reload
          restartPolicy: Never
          nodeSelector:
            storage.ibmcloud.k8s.io/vpc-csi-ready: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reload
              # Docker Official Image, all four standard architectures.
              image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
              command: [python3, /scripts/reload-credentials.py]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: vpc-csi-credential-reload
