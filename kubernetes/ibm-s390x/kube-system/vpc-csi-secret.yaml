apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-secret-store
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: secretstore-ibm-k8s
    kind: ClusterSecretStore
  target:
    name: storage-secret-store
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        slclient.toml: |
          [server]
          debug_trace = false

          [vpc]
          iam_client_id = "bx"
          iam_client_secret = "bx"
          g2_token_exchange_endpoint_url = "https://iam.cloud.ibm.com"
          g2_riaas_endpoint_url = "https://eu-de.iaas.cloud.ibm.com"
          g2_resource_group_id = "2000898ba4d2456bb7294b7a1329dd9a"
          g2_api_key = "{{ .api_key }}"
          provider_type = "g2"
  data:
    - secretKey: api_key
      remoteRef:
        key: iam_credentials/352757d9-a239-aa3c-a70a-4d0c583f0244
